spring:
  application:
    name: workout-gym-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/workout_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: 3c6e0b8a9c15224a8228b9a98ca1531d3c6e0b8a9c15224a8228b9a98ca1531d
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    com.sanele.workouttracker: DEBUG
    org.springframework.security: INFO
